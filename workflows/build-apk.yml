name: Compilar APK de MIIA

# Se ejecuta a mano (pestaña Actions > Compilar APK de MIIA > Run workflow) o al cambiar el código de la app.
# No se vuelve a ejecutar cuando MIIA sincroniza su memoria (esos archivos viven en cloud/ y server/).
on:
  workflow_dispatch: {}
  push:
    paths:
      - "main.py"
      - "miia_core.py"
      - "miia_android/**"
      - "java_src/**"
      - "assets/**"
      - "buildozer.spec"
      - "tools/patch_p4a.py"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pruebas de la lógica (rápidas; no bloquean la compilación)
        continue-on-error: true
        run: python tests/test_logic.py

      - name: Paquetes del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool libtool-bin pkg-config build-essential \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libltdl-dev ccache

      - name: Herramientas de Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install "buildozer>=1.5.0,<2" "cython==0.29.34" virtualenv

      - name: Descargar python-for-android y prepararlo para MIIA
        run: |
          git clone --depth 1 --branch master https://github.com/kivy/python-for-android.git p4a_src
          python tools/patch_p4a.py p4a_src java_src

      - name: Firma estable (para poder actualizar la app sin perder datos)
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore

      - uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}-v1
          restore-keys: buildozer-

      - name: Compilar
        run: yes | buildozer -v android debug

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: MIIA-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
